[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rvforge"
version = "0.1.0"
description = "Python neural networks to portable C and RV32 bare-metal test firmware"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "onnx>=1.16", "onnxruntime>=1.18", "torch>=2.2"]

[project.scripts]
rvforge = "rvforge.cli:main"

[tool.setuptools]
packages = ["rvforge"]

[tool.setuptools.package-data]
rvforge = ["target/*"]
